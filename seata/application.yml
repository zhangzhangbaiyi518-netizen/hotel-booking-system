server:
  port: ${SEATA_CONSOLE_PORT:13313}
spring:
  application:
    name: seata-server
logging:
  file:
    path: /seata-server/logs
console:
  user:
    username: ${SEATA_CONSOLE_USER:seata}
    password: ${SEATA_CONSOLE_PASSWORD:seata}
seata:
  config:
    type: file
  registry:
    type: nacos
    nacos:
      application: seata-server
      server-addr: ${NACOS_CONTAINER_ADDR:host.docker.internal:8848}
      namespace: ${NACOS_NAMESPACE:}
      group: ${SEATA_NACOS_GROUP:SEATA_GROUP}
      cluster: default
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
  server:
    service-port: ${SEATA_PORT:13314}
  store:
    mode: file
    file:
      dir: /seata-server/sessionStore
      flush-disk-mode: sync
  security:
    secretKey: ${SEATA_SERVER_SECRET:SeataSecretKey0c382ef121d778043159209298fd40bf3850a017}
    tokenValidityInMilliseconds: 1800000
    ignore:
      urls: /,/**/*.css,/**/*.js,/**/*.html,/**/*.map,/**/*.svg,/**/*.png,/**/*.jpeg,/**/*.ico,/api/v1/auth/login
