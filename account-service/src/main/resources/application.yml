server:
  port: ${HOTEL_ACCOUNT_PORT:13308}
  address: ${HOTEL_SERVICE_BIND_ADDRESS:127.0.0.1}
spring:
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        ip: ${NACOS_DISCOVERY_IP:127.0.0.1}
  application:
    name: account-service
  datasource:
    url: ${HOTEL_ACCOUNT_DB_URL:${HOTEL_DB_URL:jdbc:mysql://127.0.0.1:13306/hotel_db?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8}}
    username: ${HOTEL_DB_USER:root}
    password: ${HOTEL_DB_PASSWORD:}
  sql:
    init:
      mode: always

mybatis:
  configuration:
    map-underscore-to-camel-case: true
